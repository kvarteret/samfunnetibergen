name: Sync pending events to Slack

on:
  schedule:
    # Daily at 07:37 UTC (09:37 Oslo summer, 08:37 winter).
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # GitHub OIDC login to Infisical.
  id-token: write

concurrency:
  group: pending-slack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Load /nettside configuration from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_JOBS_IDENTITY_ID }}
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: faedb783-c2d7-45aa-ae13-f6607c5cca93
          env-slug: prod
          secret-path: /nettside
          export-type: env
      - name: Notify new pending requests in nettside
        env:
        run: npm --workspace @samfunnet/web run events:sync:pending-slack
