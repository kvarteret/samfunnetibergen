name: Import TicketCo events

on:
  schedule:
    # Both UTC equivalents; the Oslo guard rejects early runs and receipts dedupe.
    - cron: "0 4,5 * * 3"
    - cron: "0 16,17 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Extract and validate without writing events or scheduler state"
        type: boolean
        default: true
      force:
        description: "Run before the next 72-hour interval (deduplication still applies)"
        type: boolean
        default: false

permissions:
  contents: read
  # GitHub OIDC login to Infisical.
  id-token: write

concurrency:
  group: ticketco-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Load /nettside configuration from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_JOBS_IDENTITY_ID }}
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: faedb783-c2d7-45aa-ae13-f6607c5cca93
          env-slug: prod
          secret-path: /nettside
          export-type: env
      - name: Import with Luna
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          if [[ "$SCHEDULED" == "true" ]]; then args+=(--scheduled); fi
          npm --workspace @samfunnet/web run events:import:ticketco -- "${args[@]}"
