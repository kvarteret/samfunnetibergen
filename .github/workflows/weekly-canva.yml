name: Generate Ukas post with Skonk

on:
  schedule:
    # Sunday 08:00 Oslo is 06:00 UTC in summer and 07:00 UTC in winter.
    # The Oslo-time guard rejects early runs; the weekly receipt deduplicates.
    - cron: "0 6,7 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare copy without creating Canva designs or sending Slack"
        type: boolean
        default: true
      week:
        description: "Optional Monday date YYYY-MM-DD; otherwise next week"
        type: string
        default: ""

permissions:
  contents: read
  # GitHub OIDC login to Infisical.
  id-token: write

concurrency:
  group: weekly-canva
  cancel-in-progress: false

jobs:
  generate:
    # Manual runs are always available; scheduled runs require the repository
    # variable to be explicitly enabled.
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_CANVA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Load /nettside configuration from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_JOBS_IDENTITY_ID }}
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: faedb783-c2d7-45aa-ae13-f6607c5cca93
          env-slug: prod
          secret-path: /nettside
          export-type: env
      - name: Load /nettside-jobs configuration from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_JOBS_IDENTITY_ID }}
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: faedb783-c2d7-45aa-ae13-f6607c5cca93
          env-slug: prod
          secret-path: /nettside-jobs
          export-type: env
      - name: Generate the weekly review draft
        env:
          CANVA_WEEKLY_TEMPLATE_DESIGN_ID: ${{ vars.CANVA_WEEKLY_TEMPLATE_DESIGN_ID || 'DAHXWWAf59c' }}
          CANVA_WEEKLY_WORK_FOLDER_ID: ${{ vars.CANVA_WEEKLY_WORK_FOLDER_ID }}
          CANVA_WEEKLY_OUTPUT_FOLDER_ID: ${{ vars.CANVA_WEEKLY_OUTPUT_FOLDER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          WEEK: ${{ inputs.week }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$SCHEDULED" == "true" ]]; then args+=(--scheduled); fi
          if [[ -n "$WEEK" ]]; then args+=(--week "$WEEK"); fi
          npm --workspace @samfunnet/web run events:weekly:canva -- "${args[@]}"
