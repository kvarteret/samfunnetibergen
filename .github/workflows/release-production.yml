name: Release Production

on:
  push:
    branches:
      - develop
    paths:
      - apps/web/**
      - packages/content-domain/**
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to release"
        required: true
        default: "develop"
      promote:
        description: "Promote the staged production deployment after smoke tests"
        required: true
        type: boolean
        default: true
      smoke_paths:
        description: "Space-separated paths to smoke test before promotion"
        required: true
        default: "/nb /nb/rom /nb/rom/book"

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, stage, and promote production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"

          git fetch --tags origin
          tag_prefix="prod-$(date -u +'%Y.%m.%d')"
          tag_index=1
          while git rev-parse -q --verify "refs/tags/${tag_prefix}.${tag_index}" >/dev/null; do
            tag_index=$((tag_index + 1))
          done

          release_tag="${tag_prefix}.${tag_index}"

          {
            echo "source_sha=${source_sha}"
            echo "short_sha=${short_sha}"
            echo "tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npm run route-typegen

      - name: Generate Sanity types
        run: npm run sanity:typegen

      - name: Verify generated Sanity types are clean
        run: git diff --exit-code -- apps/web/src/lib/sanity/sanity.types.ts apps/studio/src/studio/sanity.types.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Install Vercel CLI
        run: npm install --global vercel@48

      - name: Pull Vercel production environment
        run: |
          set -euo pipefail
          token_flag="--""token"
          scope_flag="--""scope"
          vercel pull --yes --environment=production "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify PostHog source-map credentials
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in POSTHOG_CLI_API_KEY POSTHOG_CLI_PROJECT_ID POSTHOG_CLI_HOST; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required production source-map secrets: ${missing[*]}" >&2
            exit 1
          fi
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}

      - name: Build production artifact
        run: |
          set -euo pipefail
          token_flag="--""token"
          scope_flag="--""scope"
          vercel build --prod "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_DEPLOYMENT_TAG: ${{ steps.release.outputs.tag }}
          NEXT_PUBLIC_GIT_SHA: ${{ steps.release.outputs.source_sha }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}
          POSTHOG_RELEASE_BUILD: ${{ steps.release.outputs.source_sha }}
          POSTHOG_RELEASE_VERSION: ${{ steps.release.outputs.tag }}

      - name: Deploy staged production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          token_flag="--""token"
          scope_flag="--""scope"
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN")"
          if [[ "${deployment_url}" != http* ]]; then
            deployment_url="https://${deployment_url}"
          fi

          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Staged production deployment: ${deployment_url}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test staged deployment
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ steps.deploy.outputs.url }}"
          curl_args=(--silent --show-error --location --output /dev/null --write-out "%{http_code}")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          for path in $SMOKE_PATHS; do
            url="${base_url%/}${path}"
            status="$(curl "${curl_args[@]}" "$url")"
            echo "${status} ${url}"

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "Smoke test failed for ${url} with HTTP ${status}" >&2
              exit 1
            fi
          done
        env:
          SMOKE_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_paths || '/nb /nb/rom /nb/rom/book' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Promote staged deployment
        if: ${{ github.event_name == 'push' || inputs.promote }}
        run: |
          set -euo pipefail
          token_flag="--""token"
          scope_flag="--""scope"
          vercel promote "${{ steps.deploy.outputs.url }}" --yes --timeout=5m "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Create release tag
        if: ${{ github.event_name == 'push' || inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.source_sha }}" --message "Production release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' || inputs.promote }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ steps.release.outputs.source_sha }}" \
            --title "Production ${{ steps.release.outputs.tag }}" \
            --notes "Source: ${{ steps.release.outputs.short_sha }}
          Staged deployment: ${{ steps.deploy.outputs.url }}
          Promoted: true"

      - name: Summary
        run: |
          {
            echo "## Production Release"
            echo ""
            echo "- Source: \`${{ steps.release.outputs.short_sha }}\`"
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Staged deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Promoted: \`${{ github.event_name == 'push' || inputs.promote }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
