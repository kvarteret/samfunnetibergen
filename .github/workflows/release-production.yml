name: Release Production

on:
  push:
    branches:
      - develop
    paths:
      - apps/web/**
      - apps/party/**
      - packages/content-domain/**
      - package.json
      - package-lock.json
      - .github/workflows/release-production.yml
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to release"
        required: true
        default: "develop"
      promote:
        description: "Promote the staged production deployment after smoke tests"
        required: true
        type: boolean
        default: true
      smoke_paths:
        description: "Space-separated paths to smoke test before promotion"
        required: true
        default: "/nb /nb/rom /nb/rom/book"

permissions:
  contents: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, stage, and promote production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Public Vercel identifiers; only credentials come from Infisical.
    env:
      VERCEL_ORG_ID: team_ZgZXWbgIa2o1LwXiVJBCkfSb
      VERCEL_PROJECT_ID: prj_OHYAWhiMGYIYvZ2UaBqnVSLRRQQi

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"

          git fetch --tags origin
          tag_prefix="prod-$(date -u +'%Y.%m.%d')"
          tag_index=1
          while git rev-parse -q --verify "refs/tags/${tag_prefix}.${tag_index}" >/dev/null; do
            tag_index=$((tag_index + 1))
          done

          release_tag="${tag_prefix}.${tag_index}"
          # Retries need distinct IDs; Vercel allows at most 32 alphanumeric,
          # hyphen, or underscore characters for prebuilt deployment IDs.
          deployment_id="prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$deployment_id" =~ ^[a-zA-Z0-9_-]{1,32}$ ]]; then
            echo "Invalid prebuilt deployment ID" >&2
            exit 1
          fi

          {
            echo "source_sha=${source_sha}"
            echo "short_sha=${short_sha}"
            echo "tag=${release_tag}"
            echo "deployment_id=${deployment_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome format check
        run: npm run format:check

      - name: Lint (Biome)
        run: npm run lint

      - name: Generate Next.js route types
        run: npm run route-typegen

      # Sanity TypeGen is a compilation input that is committed and contains
      # only types, so the release build does not regenerate it. Drift is
      # gated on pull requests, where the typegen inputs changed.
      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Load production application config
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 242f2c14-008b-4e8a-a78c-820300ee0c5f
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: faedb783-c2d7-45aa-ae13-f6607c5cca93
          env-slug: prod
          secret-path: /nettside
          export-type: env

      - name: Load deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 242f2c14-008b-4e8a-a78c-820300ee0c5f
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: cb100288-29b5-44a8-9bde-86815cdbb63d
          env-slug: prod
          secret-path: /nettside
          export-type: env

      - name: Load Worker deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 242f2c14-008b-4e8a-a78c-820300ee0c5f
          oidc-audience: https://secrets.samfunnetibergen.no
          domain: https://secrets.samfunnetibergen.no
          project-id: cb100288-29b5-44a8-9bde-86815cdbb63d
          env-slug: prod
          secret-path: /party
          export-type: env

      # Compares the bundle wrangler would upload with the fingerprint recorded
      # on the live Worker version, so the Worker deploys only when what runs
      # would actually change, however the repository changed.
      - name: Check lekeplass Worker
        id: worker
        run: npm --workspace @samfunnet/party run --silent deploy:check >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Pull Vercel production environment
        run: |
          set -euo pipefail
          token_flag="--""token"
          scope_flag="--""scope"
          vercel pull --yes --environment=production "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN"

      - name: Verify PostHog production credentials
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          # The PostHog host and project id are committed defaults; these two
          # values come from Infisical.
          for name in POSTHOG_CLI_API_KEY NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required production PostHog secrets: ${missing[*]}" >&2
            exit 1
          fi

          if [[ ! "$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN" =~ ^phc_[a-zA-Z0-9_-]+$ ]] ||
             [[ "${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}" != "https://eu.i.posthog.com" ]]; then
            echo "Invalid or inconsistent PostHog capture credentials" >&2
            exit 1
          fi

      - name: Build production artifact
        run: |
          set -euo pipefail
          token_flag="--""token"
          scope_flag="--""scope"
          export VERCEL_DEPLOYMENT_ID="${{ steps.release.outputs.deployment_id }}"
          vercel build --prod \
            "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN"
        env:
          # The canonical origin for prerendered metadata is public and fixed;
          # pulled Vercel values can be undecryptable placeholders.
          SITE_URL: https://www.samfunnetibergen.no
          NEXT_PUBLIC_DEPLOYMENT_TAG: ${{ steps.release.outputs.tag }}
          NEXT_PUBLIC_GIT_SHA: ${{ steps.release.outputs.source_sha }}
          POSTHOG_RELEASE_BUILD: ${{ steps.release.outputs.source_sha }}
          POSTHOG_RELEASE_VERSION: ${{ steps.release.outputs.tag }}

      - name: Deploy staged production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          token_flag="--""token"
          scope_flag="--""scope"
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --skip-domain "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN")"
          if [[ "${deployment_url}" != http* ]]; then
            deployment_url="https://${deployment_url}"
          fi

          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Staged production deployment: ${deployment_url}"

      - name: Smoke test staged deployment
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ steps.deploy.outputs.url }}"
          curl_args=(--silent --show-error --location --output /dev/null --write-out "%{http_code}")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          for path in $SMOKE_PATHS; do
            url="${base_url%/}${path}"
            status="$(curl "${curl_args[@]}" "$url")"
            echo "${status} ${url}"

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "Smoke test failed for ${url} with HTTP ${status}" >&2
              exit 1
            fi
          done
        env:
          SMOKE_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_paths || '/nb /nb/rom /nb/rom/book' }}

      - name: Smoke test PostHog capture credentials
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg token "$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN" '{token: $token, distinct_id: "production-release-smoke", send_feature_flag_events: false}')"
          curl_args=(--silent --show-error --header 'Content-Type: application/json')
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          status="$(curl "${curl_args[@]}" --data "$payload" --output /dev/null --write-out '%{http_code}' '${{ steps.deploy.outputs.url }}/ingest/flags/?v=2')"
          echo "PostHog flags proxy: HTTP ${status}"
          if [[ "$status" != "200" ]]; then
            echo "PostHog capture credentials or proxy failed smoke test" >&2
            exit 1
          fi

      - name: Smoke test public machine-readable endpoints
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ steps.deploy.outputs.url }}"
          curl_args=(--silent --show-error --location)
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          request_json() {
            local url="$1"
            local body="$2"
            local headers="$3"
            local status
            status="$(curl "${curl_args[@]}" --dump-header "$headers" --output "$body" --write-out "%{http_code}" "$url")"
            echo "${status} ${url}"
            if [[ "$status" != "200" ]]; then
              echo "Machine-readable smoke test failed for ${url} with HTTP ${status}" >&2
              exit 1
            fi
          }

          request_json "${base_url%/}/api/v1/events?locale=nb" "$temp_dir/events.json" "$temp_dir/events.headers"
          request_json "${base_url%/}/api/v1/events/taxonomy?locale=nb" "$temp_dir/taxonomy.json" "$temp_dir/taxonomy.headers"
          request_json "${base_url%/}/api/v1/openapi.json" "$temp_dir/openapi.json" "$temp_dir/openapi.headers"

          grep -Eiq '^content-type: application/json(;|[[:space:]])' "$temp_dir/events.headers"
          grep -Eiq '^content-type: application/json(;|[[:space:]])' "$temp_dir/taxonomy.headers"
          grep -Eiq '^content-type: application/json(;|[[:space:]])' "$temp_dir/openapi.headers"
          grep -Eiq '^etag:[[:space:]]*"' "$temp_dir/events.headers"
          grep -Eiq '^etag:[[:space:]]*"' "$temp_dir/taxonomy.headers"
          jq -e '.meta.locale == "nb" and (.data | type == "array")' "$temp_dir/events.json" >/dev/null
          jq -e 'all(.data[]; ((.schedule.kind == "timed" and (.schedule.startsAt | endswith("Z"))) or (.schedule.kind == "date" and (.schedule.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")))) and (.event.description.html | type == "string") and (.event.description.text | type == "string") and (.event.links.website | type == "string") and ((.event.links.facebook == null) or (.event.links.facebook | type == "string")))' "$temp_dir/events.json" >/dev/null
          jq -e '(.eventTypeGroups | type == "array") and (.rooms | type == "array") and all(.eventTypeGroups[]; (.id | type == "string") and (.name | type == "string") and (.eventTypes | type == "array") and all(.eventTypes[]; (.id | type == "string") and (.name | type == "string"))) and all(.rooms[]; (.id | type == "string") and (.name | type == "string") and (.slug | type == "string"))' "$temp_dir/taxonomy.json" >/dev/null
          jq -e '.openapi == "3.1.0"' "$temp_dir/openapi.json" >/dev/null
          jq -e '.security == [] and (.paths["/api/v1/events"] | has("get") and has("head") and has("options")) and (.paths["/api/v1/events/taxonomy"] | has("get") and has("head") and has("options")) and (.components.schemas.PublicEventTaxonomyResponse != null)' "$temp_dir/openapi.json" >/dev/null

          event_etag="$(awk 'BEGIN { IGNORECASE = 1 } /^etag:/ { sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit }' "$temp_dir/events.headers")"
          conditional_status="$(curl "${curl_args[@]}" --header "If-None-Match: ${event_etag}" --output /dev/null --write-out "%{http_code}" "${base_url%/}/api/v1/events?locale=nb")"
          if [[ "$conditional_status" != "304" ]]; then
            echo "Conditional events smoke test failed with HTTP ${conditional_status}" >&2
            exit 1
          fi

      # Deployed before promotion: a failed Worker deploy or health check
      # stops the release, so the website never ships ahead of the protocol
      # it speaks. The Worker must stay compatible with the live website for
      # the minutes until promotion.
      - name: Deploy lekeplass Worker
        if: ${{ steps.worker.outputs.changed == 'true' && (github.event_name == 'push' || inputs.promote) }}
        shell: bash
        env:
          # The Worker only answers allowed origins; NEXT_PUBLIC_SITE_URL is no
          # longer in the loaded environment, so use the fixed canonical origin.
          SITE_URL: https://www.samfunnetibergen.no
        run: |
          set -euo pipefail

          npm --workspace @samfunnet/party run deploy -- \
            "${{ steps.release.outputs.tag }} ${{ steps.release.outputs.short_sha }}"

          host="${NEXT_PUBLIC_PARTY_HOST:-}"
          if [[ -z "$host" ]]; then
            echo "NEXT_PUBLIC_PARTY_HOST is missing; cannot verify the Worker" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Origin: ${SITE_URL%/}" "https://${host}/health" || true)"
            echo "Worker health attempt ${attempt}: HTTP ${status}"
            [[ "$status" == "200" ]] && exit 0
            sleep 5
          done
          echo "Lekeplass Worker failed its health check after deploy" >&2
          exit 1

      - name: Promote staged deployment
        if: ${{ github.event_name == 'push' || inputs.promote }}
        run: |
          set -euo pipefail
          token_flag="--""token"
          scope_flag="--""scope"
          vercel promote "${{ steps.deploy.outputs.url }}" --yes --timeout=5m "$scope_flag" "$VERCEL_ORG_ID" "$token_flag" "$VERCEL_TOKEN"

      - name: Create release tag
        if: ${{ github.event_name == 'push' || inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.source_sha }}" --message "Production release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' || inputs.promote }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ steps.release.outputs.source_sha }}" \
            --title "Production ${{ steps.release.outputs.tag }}" \
            --notes "Source: ${{ steps.release.outputs.short_sha }}
          Staged deployment: ${{ steps.deploy.outputs.url }}
          Promoted: true"

      - name: Summary
        run: |
          {
            echo "## Production Release"
            echo ""
            echo "- Source: \`${{ steps.release.outputs.short_sha }}\`"
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Staged deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Lekeplass Worker deployed: \`${{ steps.worker.outputs.changed == 'true' && (github.event_name == 'push' || inputs.promote) }}\` (fingerprint \`${{ steps.worker.outputs.fingerprint }}\`)"
            echo "- Promoted: \`${{ github.event_name == 'push' || inputs.promote }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
