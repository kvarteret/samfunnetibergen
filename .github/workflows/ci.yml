name: Workspace checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - name: Biome format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Generate Next.js route types
        run: npm run route-typegen

      - name: Generate Sanity types
        run: npm run sanity:typegen

      - name: Verify generated Sanity types are clean
        run: git diff --exit-code -- apps/web/src/lib/sanity/sanity.types.ts apps/studio/src/studio/sanity.types.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Website production build
        run: npm run build:web

      - name: Studio production build
        run: npm run build:studio
