name: Workspace checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - name: Detect application changes
        id: app_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE_SHA" HEAD -- \
            apps/web \
            packages/content-domain \
            package.json \
            package-lock.json; then
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA" HEAD -- \
            apps/studio \
            packages/content-domain \
            package.json \
            package-lock.json; then
            echo "studio_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "studio_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Biome format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npm run route-typegen

      - name: Generate Sanity types
        run: npm run sanity:typegen

      - name: Verify generated Sanity types are clean
        run: git diff --exit-code -- apps/web/src/lib/sanity/sanity.types.ts apps/studio/src/studio/sanity.types.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Website production build
        if: steps.app_changes.outputs.web_changed == 'true'
        run: npm run build:web

      - name: Studio production build
        if: steps.app_changes.outputs.studio_changed == 'true'
        run: npm run build:studio
