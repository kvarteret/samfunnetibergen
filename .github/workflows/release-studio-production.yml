name: Release Sanity Studio

on:
  push:
    branches:
      - develop
    paths:
      - apps/studio/**
      - packages/content-domain/**
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to release"
        required: true
        default: "develop"
      promote:
        description: "Promote the staged Studio deployment after smoke tests"
        required: true
        type: boolean
        default: true
      register_external:
        description: "Register the production Studio URL and schema with Sanity"
        required: true
        type: boolean
        default: false
      smoke_paths:
        description: "Space-separated Studio paths to smoke test"
        required: true
        default: "/ /structure/arrangement /static/manifest.webmanifest"

permissions:
  contents: write

concurrency:
  group: studio-production-release
  cancel-in-progress: false

env:
  STUDIO_PUBLIC_URL: https://studio.samfunnetibergen.no

jobs:
  release:
    name: Build, stage, and promote Studio
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: studio-production

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"

          git fetch --tags origin
          tag_prefix="studio-prod-$(date -u +'%Y.%m.%d')"
          tag_index=1
          while git rev-parse -q --verify "refs/tags/${tag_prefix}.${tag_index}" >/dev/null; do
            tag_index=$((tag_index + 1))
          done

          release_tag="${tag_prefix}.${tag_index}"

          {
            echo "source_sha=${source_sha}"
            echo "short_sha=${short_sha}"
            echo "tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npm run route-typegen

      - name: Generate Sanity types
        run: npm run sanity:typegen

      - name: Verify generated Sanity types are clean
        run: git diff --exit-code -- apps/web/src/lib/sanity/sanity.types.ts apps/studio/src/studio/sanity.types.ts

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Pull Studio Vercel production environment
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production \
            --project "$STUDIO_VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"
        env:
          STUDIO_VERCEL_PROJECT_ID: ${{ secrets.STUDIO_VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      # This is the authoritative production Studio build. Do not add a
      # separate npm run build:studio step before it; Vercel would build the
      # same artifact a second time.
      - name: Build production artifact
        run: |
          set -euo pipefail
          vercel build --prod \
            --project "$STUDIO_VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"
        env:
          STUDIO_VERCEL_PROJECT_ID: ${{ secrets.STUDIO_VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Deploy staged Studio artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain \
            --project "$STUDIO_VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN")"
          if [[ "${deployment_url}" != http* ]]; then
            deployment_url="https://${deployment_url}"
          fi

          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Staged Studio deployment: ${deployment_url}"
        env:
          STUDIO_VERCEL_PROJECT_ID: ${{ secrets.STUDIO_VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Smoke test staged Studio deployment
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ steps.deploy.outputs.url }}"
          curl_args=(--silent --show-error --location --output /dev/null --write-out "%{http_code}")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          for path in $SMOKE_PATHS; do
            url="${base_url%/}${path}"
            status="$(curl "${curl_args[@]}" "$url")"
            echo "${status} ${url}"

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "Smoke test failed for ${url} with HTTP ${status}" >&2
              exit 1
            fi
          done
        env:
          SMOKE_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_paths || '/ /structure/arrangement /static/manifest.webmanifest' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Register external Studio and schema with Sanity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.register_external }}
        shell: bash
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SANITY_AUTH_TOKEN:-}" ]]; then
            echo "SANITY_AUTH_TOKEN is required when register_external=true" >&2
            exit 1
          fi

          printf '%s' "$SANITY_AUTH_TOKEN" | npx sanity login --with-token
          npm --workspace @samfunnet/studio exec -- sanity deploy \
            --external \
            --url "$STUDIO_PUBLIC_URL" \
            --title "Samfunnet i Bergen Studio" \
            --schema-required \
            --yes

      - name: Promote staged Studio deployment
        if: ${{ github.event_name == 'push' || inputs.promote }}
        run: |
          set -euo pipefail
          vercel promote "${{ steps.deploy.outputs.url }}" --yes --timeout=5m \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Create Studio release tag
        if: ${{ github.event_name == 'push' || inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.source_sha }}" --message "Studio production release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub Studio release
        if: ${{ github.event_name == 'push' || inputs.promote }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ steps.release.outputs.source_sha }}" \
            --title "Studio production ${{ steps.release.outputs.tag }}" \
            --notes "Source: ${{ steps.release.outputs.short_sha }}
          Staged deployment: ${{ steps.deploy.outputs.url }}
          Promoted: true"

      - name: Summary
        run: |
          {
            echo "## Sanity Studio Release"
            echo ""
            echo "- Source: \`${{ steps.release.outputs.short_sha }}\`"
            echo "- Staged deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Promoted: \`${{ github.event_name == 'push' || inputs.promote }}\`"
            echo "- External Sanity registration requested: \`${{ github.event_name == 'workflow_dispatch' && inputs.register_external || false }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
