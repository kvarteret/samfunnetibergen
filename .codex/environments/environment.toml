version = 1
name = "samfunnetibergen"

[setup]
script = """
set -euo pipefail

cd "${CODEX_WORKTREE_PATH:-.}"

if command -v mise >/dev/null 2>&1; then
  mise trust --yes mise.toml
  mise install
  mise exec -- pnpm install --frozen-lockfile
else
  corepack enable pnpm
  pnpm install --frozen-lockfile
fi
"""

[cleanup]
script = """
set -euo pipefail

cd "${CODEX_WORKTREE_PATH:-.}"
rm -rf .cache/tmp
"""

[[actions]]
name = "Website"
icon = "run"
command = "pnpm run dev:web"

[[actions]]
name = "Studio"
icon = "run"
command = "pnpm run dev:studio"

[[actions]]
name = "Test"
icon = "run"
command = "pnpm run test"

[[actions]]
name = "Lint"
icon = "run"
command = "pnpm run lint"

[[actions]]
name = "Build"
icon = "run"
command = "pnpm run build"
