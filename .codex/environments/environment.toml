version = 1
name = "samfunnetibergen"

[setup]
script = """
set -euo pipefail

cd "${CODEX_WORKTREE_PATH:-.}"

if command -v mise >/dev/null 2>&1; then
  mise trust --yes mise.toml
  mise install
  mise exec -- npm ci
else
  npm ci
fi
"""

[cleanup]
script = """
set -euo pipefail

cd "${CODEX_WORKTREE_PATH:-.}"
rm -rf .cache/tmp
"""

[[actions]]
name = "Website"
icon = "run"
command = "npm run dev:web"

[[actions]]
name = "Studio"
icon = "run"
command = "npm run dev:studio"

[[actions]]
name = "Test"
icon = "run"
command = "npm run test"

[[actions]]
name = "Lint"
icon = "run"
